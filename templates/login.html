{% extends "base_auth.html" %}
{% load static %}
{% block content %}

<style>
  body {
    background: radial-gradient(circle at 10% 20%, #fbfaf8 0%, #f3f1ec 90%) !important;
    position: relative;
    overflow-x: hidden;
  }
  
  body::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: url("{% static 'images/image.png' %}") no-repeat center center;
    background-size: contain;
    opacity: 0.015;
    pointer-events: none;
    z-index: -1;
  }

  .toga-login-surface {
    background: #ffffff !important;
    border: 1px solid rgba(17, 17, 17, 0.06) !important;
    border-radius: 20px !important;
    box-shadow: 0 15px 35px rgba(50, 48, 46, 0.04) !important;
    width: 100%;
    max-width: 420px;
    padding: 1.5rem;
  }

  .toga-login-surface .form-floating { position: relative; }
  .toga-login-surface .form-control {
    background-color: #faf9f6 !important;
    border: 1px solid #e6e3dd !important;
    color: #111111 !important;
    border-radius: 10px !important;
    font-size: 0.92rem !important;
    font-weight: 500 !important;
    padding-left: 1.25rem !important;
    height: 56px !important;
    transition: all 0.2s ease;
  }
  .toga-login-surface .form-control:focus {
    background-color: #ffffff !important;
    border-color: #111111 !important;
    box-shadow: none !important;
  }
  
  .btn-toga-gate {
    background-color: #111111 !important;
    border: 1px solid #111111 !important;
    color: #ffffff !important;
    font-size: 0.9rem !important;
    font-weight: 600 !important;
    padding: 0.75rem 1rem !important;
    border-radius: 10px !important;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-toga-gate:hover { background-color: #2b2927 !important; transform: translateY(-1px); }
  
  .toga-gate-link { color: #111111 !important; font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(17, 17, 17, 0.15); }
</style>

<div class="d-flex flex-column justify-content-center align-items-center px-3" style="min-height: 100vh;">
  
  <div class="text-center mb-4">
    <img src="{% static 'images/image.png' %}" alt="Toga Logo" height="70" class="mb-2" style="mix-blend-mode: multiply;">
    <h2 class="fw-800 text-dark m-0" style="letter-spacing: -0.5px; font-weight: 800; font-size: 1.5rem;">Toga Fashion House</h2>
  </div>

  <div class="card border-0 toga-login-surface">
    <div class="card-body p-3">
      <h4 class="fw-bold text-dark mb-4">Welcome Back</h4>
      
      {% if form.non_field_errors %}
        <div class="alert alert-danger p-2 small mb-3">
          {% for error in form.non_field_errors %}
            {{ error }}
          {% endfor %}
        </div>
      {% endif %}
      
      <form method="post" autocomplete="off">
        {% csrf_token %}
        
        <input type="hidden" name="next" value="{{ next|default:'/' }}">

        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
          <label for="username">Username</label>
        </div>

        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
          <label for="password">Password</label>
        </div>

        <button type="submit" class="btn btn-toga-gate w-100">
          Authenticate Access
        </button>
      </form>

      <p class="text-center mt-4 mb-1 text-muted small">
        Don’t have an authorized account? <a href="{% url 'register' %}" class="toga-gate-link">Register here</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
