{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Inventory</h1>
<a href="{% url 'inventory_create' %}" class="btn btn-warning mb-3">Add New Item</a>

<table class="table table-striped shadow-sm">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Quantity</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for item in inventory %}
    <tr>
      <td>{{ item.name }}</td>
      <td>
        <span class="badge {% if item.quantity < 5 %} bg-danger {% else %} bg-success {% endif %}">
          {{ item.quantity }}
        </span>
      </td>
      <td>
        <a href="{% url 'inventory_detail' item.id %}" class="btn btn-sm btn-info">View</a>
        <a href="{% url 'inventory_edit' item.id %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'inventory_delete' item.id %}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3" class="text-center">No inventory items found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
