{% extends "base.html" %}
{% block title %}Measurement Details{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{{ measurement.client.name }}'s Measurements</h2>
        <div>
            <a href="{% url 'measurement_edit' measurement.id %}" class="btn btn-warning">Edit</a>
            <a href="{% url 'measurement_delete' measurement.id %}" class="btn btn-danger">Delete</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row">
                {% for label, value in fields %}
                    <div class="col-md-4 mb-3">
                        <div class="p-2 border-bottom">
                            <small class="text-muted d-block">{{ label }}</small>
                            <span class="fw-bold fs-5">{{ value|default:"—" }}</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
    
    <div class="mt-4">
        <a href="{% url 'client_detail' measurement.client.id %}" class="btn btn-secondary">Back to Profile</a>
    </div>
</div>
{% endblock %}
