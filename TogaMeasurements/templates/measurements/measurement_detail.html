{% extends "base.html" %}
{% block title %}Select Gender{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-75 mt-5">
    
    <h2 class="mb-5 fw-bold text-dark">
        <i class="fa fa-user-tag me-2"></i> Select Measurement Type
    </h2>

    <div class="row w-100 justify-content-center">
        <div class="col-md-5 mb-4">
            <div class="card shadow-lg border-0 h-100 transition-hover">
                <div class="card-body text-center p-5">
                    <i class="fa fa-male fa-4x text-primary mb-4"></i>
                    <h3 class="card-title mb-4">Men's Measurement</h3>
                    <p class="text-muted mb-4">Create a new record for male clients.</p>
                    <a href="{% url 'measurement_create_men' %}" class="btn btn-outline-primary btn-lg w-100">
                        Proceed <i class="fa fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-5 mb-4">
            <div class="card shadow-lg border-0 h-100 transition-hover">
                <div class="card-body text-center p-5">
                    <i class="fa fa-female fa-4x text-danger mb-4"></i>
                    <h3 class="card-title mb-4">Women's Measurement</h3>
                    <p class="text-muted mb-4">Create a new record for female clients.</p>
                    <a href="{% url 'measurement_create_women' %}" class="btn btn-outline-danger btn-lg w-100">
                        Proceed <i class="fa fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'measurement_list' %}" class="text-decoration-none text-secondary">
            <i class="fa fa-arrow-left me-1"></i> Back to all records
        </a>
    </div>
</div>

<style>
    .transition-hover { transition: transform 0.3s ease; }
    .transition-hover:hover { transform: translateY(-10px); }
    .min-vh-75 { min-height: 75vh; }
</style>
{% endblock %}
