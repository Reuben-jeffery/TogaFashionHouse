{% extends "base.html" %}
{% block title %}Delete Inventory Record{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 text-center text-danger">Delete Inventory Record</h2>

  <div class="card shadow-sm border-0 p-4">
    <p>Are you sure you want to delete this inventory record?</p>
    <p><strong>{{ inventory.client.name }} - {{ inventory.description }}</strong></p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a href="{% url 'inventory_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
